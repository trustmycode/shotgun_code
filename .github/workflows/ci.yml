name: Проверка

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Тесты и статический анализ
    runs-on: ubuntu-latest
    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v4

      - name: Настройка Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: Настройка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установка системных библиотек
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Установка зависимостей интерфейса
        working-directory: frontend
        run: npm ci

      - name: Сборка интерфейса
        working-directory: frontend
        run: npm run build

      - name: Тесты с обнаружением гонок
        run: go test -race -tags webkit2_41 ./...

      - name: Статический анализ Go
        run: go vet -tags webkit2_41 ./...

  build:
    name: Сборка Linux
    runs-on: ubuntu-latest
    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v4

      - name: Настройка Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: Настройка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установка системных библиотек
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Установка Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Сборка приложения
        run: wails build -platform linux/amd64 -clean -tags webkit2_41
